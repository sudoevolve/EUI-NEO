name: ci

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        window: [glfw, sdl2]
        render: [opengl, vulkan]

    steps:
      - uses: actions/checkout@v5

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libcurl4-openssl-dev \
            libgl1-mesa-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            ninja-build \
            xvfb

      - name: configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEUI_BUILD_APPS=OFF
          -DEUI_BUILD_USER_APPS=OFF
          -DEUI_BUILD_TEST_FIXTURES=ON
          -DEUI_ENABLE_INSTALL=ON
          -DEUI_WINDOW_BACKEND=${{ matrix.window }}
          -DEUI_RENDER_BACKEND=${{ matrix.render }}
          -DGLFW_BUILD_WAYLAND=OFF
          -DGLFW_BUILD_X11=ON

      - name: build
        run: cmake --build build-ci --parallel

      - name: unit tests
        run: ctest --test-dir build-ci -L unit --output-on-failure

      - name: backend probes
        run: xvfb-run -a ctest --test-dir build-ci -L probe --output-on-failure

      - name: install SDK
        run: cmake --install build-ci --prefix "$PWD/package-sdk"

      - name: verify installed package
        run: |
          cmake -S tests/consumers/find-package -B package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/package-sdk"
          cmake --build package-consumer --parallel
          ctest --test-dir package-consumer --output-on-failure

  xmake-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        window: [glfw, sdl2]
        render: [opengl, vulkan]

    steps:
      - uses: actions/checkout@v5

      - name: install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libgl1-mesa-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-vulkan-drivers

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: configure
        run: >-
          xmake f -m release -y
          --window_backend=${{ matrix.window }}
          --render_backend=${{ matrix.render }}
          --user_apps=y

      - name: build library and applications
        run: |
          xmake build -j2 eui_app
          xmake build -j2 shadertoy
          xmake build -j2 gallery

      - name: install package
        run: xmake install -o package-xmake eui_neo
